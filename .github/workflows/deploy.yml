# Build the add-in and put it in front of PowerPoint.
#
# Everything a user's PowerPoint fetches — taskpane.html, its hashed bundle, the
# icons on the ribbon button, and /manifest.xml itself — is served from the
# Worker this deploys. A change on main that never reaches the edge is invisible
# in exactly the way that bit the rest of the fleet (see pptx-font-manager's
# deploy.yml: twelve commits sat on main for sixteen days with nothing at the
# edge, while a comment claimed a Cloudflare build was connected). So this runs
# on every push to main, and nothing else deploys this Worker.
#
# The same shape as pptx-font-manager-addin's deploy.yml (itself modelled on
# pptx-font-manager's), so the add-ins read alike and a fix to one is obvious in
# the others.

name: deploy

on:
  push:
    branches: [main]
    # Prose changes nothing PowerPoint fetches. Note that paths-ignore only skips
    # a push when EVERY changed file matches, so the usual commit that touches
    # both source and its README note still deploys.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Newest push wins. Cancelling an in-flight build is safe: wrangler uploads the
# assets first and activates the version as one step at the end, so a run killed
# part way through never becomes the live version. With cancel-in-progress false,
# two quick pushes could deploy in the wrong order and leave the older tree live.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # node-version rather than a .nvmrc: 22 is what ci.yml already builds and
      # tests against. If one moves, move the other.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Fail in a second rather than after a build. A deploy that cannot
      # authenticate is the whole point of this job failing to happen.
      - name: Check the Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository, so the"
            echo "::error::add-in cannot be deployed. Create a Cloudflare API token with"
            echo "::error::the 'Edit Cloudflare Workers' template scoped to this account,"
            echo "::error::then:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN --repo stoatworks-labs/pptx-exporter-addin"
            echo "::error::cf-run already uses such a token from the login keychain under"
            echo "::error::the service name 'stoatworks-cloudflare'; the same one works here."
            exit 1
          fi
          echo "token present - ok"

      # Deliberately a plain `npm ci` — no --legacy-peer-deps, same as ci.yml. A
      # bump that only installs by ignoring the peer graph must not reach the edge.
      - run: npm ci

      # test/manifest.test.ts is the one that matters most here: it fails if
      # manifest.xml points anywhere but the origin wrangler.toml deploys to, so a
      # dev manifest can never be published as the thing users download.
      - run: npm test

      - run: npm run build

      # Not in negative-space's copy, which gates on its test suite alone. A
      # dependency mismatch builds green and throws on first render (RFutils #22,
      # three weeks of an empty page); the unit tests run in node and would not
      # notice. Both pages, because they are separate entry points and either
      # can break alone. `root: body` for the pane: outside PowerPoint it has no
      # app to mount, and its static text is the proof it rendered.
      - name: Smoke-check the install page
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: dist
      - name: Smoke-check the task pane
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: dist
          path: /taskpane.html
          root: body

      # wrangler is not a dependency of this project — locally it comes from npx
      # via `npm run deploy`, which is why the version is pinned here rather than
      # left to resolve to latest. An unpinned npx would let a wrangler major
      # change how deploys behave on a morning nobody touched this repo.
      # Dependabot's github-actions ecosystem only bumps `uses:` refs, not this,
      # so bump it deliberately — and in step with the rest of the fleet.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler's first-run metrics consent prompt would hang a non-interactive
          # run for ever. cf-run sets this locally for the same reason.
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.116.0 deploy

      # Prove it actually landed, against the URL PowerPoint loads.
      #
      # "It deployed" and "the page changed" are different claims, and the obvious
      # ways to check the second are both wrong here:
      #
      #   * The whole served body cannot be compared against dist/taskpane.html.
      #     Cloudflare injects a bot-management script before </body> carrying a
      #     per-request nonce, so no two responses are byte-identical and the check
      #     would fail every time, on a healthy deploy.
      #   * The hashed asset filename alone is not enough either. It only moves when
      #     the JS moves, so a change to the <head> — the Office.js tag, the pane's
      #     styles, which live inline there — would sail through against a stale
      #     build.
      #
      # The <head> is untouched by the injection, and Vite writes the hashed JS
      # filename into it alongside the styles. Hashing it therefore catches a code
      # change and a markup-only change alike, and is stable across requests.
      #
      # taskpane.html rather than / because the pane is what the add-in IS; the
      # install page is the courtesy. The manifest is checked as well, since it is
      # the one file a user downloads and keeps.
      - name: Check the live site is serving this build
        run: |
          set -euo pipefail
          origin="https://pptx-exporter-addin.stoatworks-labs.com"
          want=$(sed -n '1,/<\/head>/p' dist/taskpane.html | shasum -a 256 | cut -d' ' -f1)
          want_manifest=$(shasum -a 256 < dist/manifest.xml | cut -d' ' -f1)
          echo "expecting the live task pane <head> to hash to $want"
          for attempt in 1 2 3 4 5; do
            got=$(curl -sS --max-time 30 "$origin/taskpane.html" \
                  | sed -n '1,/<\/head>/p' | shasum -a 256 | cut -d' ' -f1 || true)
            got_manifest=$(curl -sS --max-time 30 "$origin/manifest.xml" | shasum -a 256 | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ] && [ "$got_manifest" = "$want_manifest" ]; then
              echo "live site is serving this build's pane and manifest (attempt $attempt)"
              exit 0
            fi
            echo "not there yet (pane $got, manifest $got_manifest) — retrying in 10s (attempt $attempt)"
            sleep 10
          done
          echo "::error::Deployed, but $origin/taskpane.html or /manifest.xml is still"
          echo "::error::not serving this build. The upload succeeded, so this is the edge"
          echo "::error::serving something else — check the Worker's routes, and that"
          echo "::error::pptx-exporter-addin is what the custom domain actually points at."
          exit 1
