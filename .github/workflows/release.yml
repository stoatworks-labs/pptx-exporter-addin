name: release

# An Office add-in has no binary of its own: what PowerPoint needs is
# manifest.xml, a pointer at the hosted build. A release here proves the
# manifest is the production one and valid, then attaches it and the installers
# that put it where PowerPoint looks: the Windows Setup.exe, built below, and
# the Mac .pkg pair, signed locally and uploaded by hand. The manifest is also
# served at https://pptx-exporter-addin.stoatworks-labs.com/manifest.xml by
# deploy.yml; the release copies exist so the website's download panel and the
# README's Download block (both generated by stoatworks-backend's
# gen-downloads.py from the releases API) have something to point at, and so a
# version is pinned to a tag. Every asset has an unversioned name deliberately:
# gen-downloads links an unversioned asset through /releases/latest/download/,
# which never goes stale.
#
# The tag must match package.json — the build stamps that version into the pane
# and the install page, and a tag that disagrees with it would publish a release
# whose own pages claim a different number.
#
# Publishes directly, never as a draft: the fleet's release tooling reads the
# latest *published* release and a draft is invisible to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json says $pkg — bump package.json (and the lockfile) before tagging"
            exit 1
          fi
          echo "v$tag matches package.json"

      - name: Build the Windows installer
        run: |
          sudo apt-get install -y --no-install-recommends nsis >/dev/null
          npm run installer:windows

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: |
            manifest.xml
            release/Advanced-Exporter-for-PowerPoint-Setup.exe
          if-no-files-found: error

      # The Mac installer and uninstaller (.pkg) are signed and notarised with
      # the identity in Allan's keychain, so they go on the release by hand
      # afterwards: `npm run installer:mac`, then
      # `gh release upload vX.Y.Z release/*.pkg`. See the README's Installers.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manifest.xml
            release/Advanced-Exporter-for-PowerPoint-Setup.exe
          generate_release_notes: true
          body: |
            **Install:** run the installer for your machine: `Advanced-Exporter-for-PowerPoint.pkg`
            on a Mac, `Advanced-Exporter-for-PowerPoint-Setup.exe` on Windows. Each puts Advanced
            Exporter into PowerPoint for your user account, with no admin password.
            `Uninstall-Advanced-Exporter-for-PowerPoint.pkg` takes it out again on a Mac; on
            Windows it's in Settings ▸ Apps ▸ Installed apps. For PowerPoint on the web, upload
            `manifest.xml` instead: instructions at https://pptx-exporter-addin.stoatworks-labs.com/.
            The add-in loads from that origin, so every deploy reaches every installed copy.
