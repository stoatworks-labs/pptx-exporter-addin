name: release

# An Office add-in has no binary. What a user "downloads" is manifest.xml — a
# pointer at the hosted build — so a release here is: prove the manifest is the
# production one and valid, then attach it, verbatim, to a GitHub release. The
# file is also served at https://pptx-exporter-addin.stoatworks-labs.com/manifest.xml
# by deploy.yml; the release copy exists so the website's download panel and the
# README's Download block (both generated by stoatworks-backend's gen-downloads.py
# from the releases API) have something to point at, and so a version is pinned
# to a tag. It is attached under its own unversioned name deliberately:
# gen-downloads links an unversioned asset through /releases/latest/download/,
# which never goes stale.
#
# The tag must match package.json — the build stamps that version into the pane
# and the install page, and a tag that disagrees with it would publish a release
# whose own pages claim a different number.
#
# Publishes directly, never as a draft: the fleet's release tooling reads the
# latest *published* release and a draft is invisible to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json says $pkg — bump package.json (and the lockfile) before tagging"
            exit 1
          fi
          echo "v$tag matches package.json"

      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: manifest.xml
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: manifest.xml
          generate_release_notes: true
          body: |
            **Install:** download `manifest.xml` below and sideload it — instructions at
            https://pptx-exporter-addin.stoatworks-labs.com/ (the same file is served
            there as `/manifest.xml`). The add-in loads from that origin, so there is nothing
            else to install and nothing to update by hand: every deploy reaches every
            installed copy.
