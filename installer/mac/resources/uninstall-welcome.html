<h1>Uninstall Advanced Exporter for PowerPoint</h1>
<p>This takes Advanced Exporter out of PowerPoint for Mac, for your user account. Other add-ins aren&rsquo;t touched, and neither is anything you exported with it.</p>
<p>PowerPoint has to be closed. If it&rsquo;s open, the uninstaller will ask to quit it.</p>
